# Builds cesiumlang/cesiumlang.org at the commit named in source.txt and
# publishes it with GitHub Pages at cesiumlang.dev. A commit to source.txt is
# made by the Dev site workflow of cesiumlang.org (the secret
# MIRROR_DEPLOY_KEY there is a deploy key of this repository); it can also be
# started by hand (Actions > Development site > Run workflow).
name: Development site

on:
  push:
    branches: [main]
    paths: [source.txt, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# The Zig that builds the site, set by hand: keep it as in the deploy.yml of
# cesiumlang/cesiumlang.org.
env:
  ZIG_VERSION: 0.17.1

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # the time zone of the dates on the pages
      TZ: America/Chicago
      # the host the site writes into its feeds and sitemap
      CESIUM_SITE_HOST: cesiumlang.dev
    steps:
      - uses: actions/checkout@v7

      - name: Read the commit to build
        id: source
        run: echo "sha=$(head -n 1 source.txt)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: cesiumlang/cesiumlang.org
          ref: ${{ steps.source.outputs.sha }}
          path: site
          fetch-depth: 0 # the page dates come from git history
          submodules: true

      - uses: randyos-org/setup-zig@node24 # v2.2.1 on Node.js 24, until upstream releases it
        with:
          version: ${{ env.ZIG_VERSION }}

      # Zine is built from source: keep what Zig built
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            site/.zig-cache
          key: zig-${{ runner.os }}-${{ hashFiles('site/build.zig.zon', 'site/grammar/build.zig.zon') }}

      - name: Build the site
        working-directory: site
        run: zig build

      - name: Files for AI models
        working-directory: site
        run: zig-out/bin/cesium-site-ai --out zig-out/public --host "$CESIUM_SITE_HOST"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/zig-out/public

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
